[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "spec-drift"
version = "0.1.0"
description = "Detect when code changes drift from governing specs and ADRs, and report it for CI."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Lila Brooks" }]
dependencies = [
]

# The anthropic/openai extras belong to the optional model-provider layer.
# Delete both extras (and mirror the change in requirements.txt) if your CLI
# does not call language models.
[project.optional-dependencies]
dev = [
    "build>=1.5.0",
    "coverage[toml]>=7.15.3",
    "hatchling>=1.31.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
anthropic = ["anthropic>=0.120.0"]
openai = [
    "openai>=2.48.0",
    "anyio>=4.14.2",
    "h11>=0.16.0",
    "idna>=3.18",
    "zipp>=4.1.0",
]

[project.scripts]
spec-drift = "spec_drift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_drift"]

[tool.hatch.build.targets.sdist]
include = [
    ".env.example",
    ".gitignore",
    "AGENTS.md",
    "src",
    "tests",
    "docs",
    "scripts",
    "Makefile",
    "requirements.txt",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "SUPPORT.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Exclusions apply to explicitly named paths too, not just directory walks.
# Without this, `ruff format docs/some-file.md` still reformats it -- an
# editor-on-save or pre-commit hook passing explicit paths would bypass the
# Markdown exclusion below.
force-exclude = true

[tool.ruff.format]
# ruff 0.16.0's formatter began discovering Markdown and reformatting the
# Python inside fenced blocks, which took `ruff format --check .` from 57
# files to 97 with no config change on our side. The docs bundle is governed
# knowledge, and some of it is captured evidence -- the one Python block in
# docs/ is the verbatim prompt-injection payload from ADR 0003's live run.
# A formatter that rewrites captured output silently falsifies it, so the
# formatter stays on Python. Linting was never affected: ruff check has
# always seen only the Python targets.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = [
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["spec_drift"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/spec_drift"]

[[tool.mypy.overrides]]
module = ["anthropic", "openai"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["spec_drift"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
